<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stremio</title>
<style>
/* Same look as the interface's own start screen (#boot in src/ui/styles/misc.css), so the
   launcher and the interface read as one continuous loading screen. */
@font-face{font-family:Inter;src:url(fonts/inter-latin-400.woff) format("woff");font-weight:400;font-style:normal}
@font-face{font-family:Inter;src:url(fonts/inter-latin-700.woff) format("woff");font-weight:700;font-style:normal}
html,body{width:100%;height:100%;overflow:hidden}
body{margin:0;background:#090b12;color:#fff;font-family:Inter,Arial,sans-serif}
.stage{position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 42%,rgba(93,57,184,.18),rgba(9,11,18,0) 38%),#090b12;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center}
.box{width:560px;position:relative}
.lg{display:block;width:94px;height:94px;margin:0 auto;-webkit-animation:bb 1.8s ease-in-out infinite;animation:bb 1.8s ease-in-out infinite}
.bt{margin-top:18px;font-size:27px;font-weight:700;letter-spacing:.6px}
.btrack{height:3px;margin:28px auto 0;width:220px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bfill{height:100%;width:34%;border-radius:3px;background:#9c76ff;-webkit-animation:loadline 1.45s ease-in-out infinite;animation:loadline 1.45s ease-in-out infinite}
@-webkit-keyframes bb{0%,100%{opacity:.72}50%{opacity:1}}
@keyframes bb{0%,100%{opacity:.72}50%{opacity:1}}
@-webkit-keyframes loadline{0%{-webkit-transform:translateX(-120%)}100%{-webkit-transform:translateX(330%)}}
@keyframes loadline{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}
/* status and hint sit below the centred block, so changing text never moves the logo */
.info{position:absolute;top:100%;left:0;right:0;margin-top:22px}
.status{min-height:24px;font-size:19px;color:rgba(255,255,255,.55)}
.hint{margin-top:10px;font-size:16px;line-height:1.4;color:rgba(255,255,255,.34);visibility:hidden}
.error{display:none;margin-top:24px}
.error button{font-family:inherit;font-size:21px;font-weight:700;padding:14px 34px;color:#0c0b11;background:#fff;border:0;border-radius:12px}
.code{margin-top:14px;font-size:15px;color:rgba(255,255,255,.34);letter-spacing:.5px}
.failed .btrack{visibility:hidden}
.failed .lg{-webkit-animation:none;animation:none;opacity:.72}
.failed .status{color:#ff9a9a}
</style>
</head>
<body>
<div class="stage"><div id="box" class="box">
  <img class="lg" src="logo.png" alt="">
  <div class="bt">StremCompat</div>
  <div class="btrack"><div class="bfill"></div></div>
  <div class="info">
    <div id="status" class="status"></div>
    <div id="hint" class="hint"></div>
    <div id="error" class="error">
      <button id="retry" onclick="location.reload()"></button>
      <div id="code" class="code">RUNTIME_START_TIMEOUT · __APP_VERSION__</div>
    </div>
  </div>
</div></div>
<script>
/* The interface language lives on the local server's origin, which this file:// page
   cannot read, so the TV language decides: Portuguese or English. */
var PT = /^pt/i.test(navigator.language || '');
var TEXT = PT ? {
    starting: 'Iniciando…',
    server: 'Preparando o servidor local…',
    almost: 'Quase pronto…',
    opening: 'Abrindo…',
    hint: 'Na primeira abertura depois de instalar, isso pode levar alguns segundos.',
    failed: 'O serviço do app não respondeu.',
    failedHint: 'Desligue a TV da tomada por 30 segundos e abra o app de novo. Se continuar, reinstale a versão __APP_VERSION__.',
    stale: 'Uma versão anterior do app ainda está rodando na TV.',
    staleHint: 'Tire a TV da tomada por 30 segundos e abra o app de novo. Desligar pelo controle não basta quando o Quick Start+ está ativo.',
    retry: 'Tentar de novo'
} : {
    starting: 'Starting…',
    server: 'Preparing the local server…',
    almost: 'Almost ready…',
    opening: 'Opening…',
    hint: 'The first launch after installing can take a few seconds.',
    failed: 'The app service did not respond.',
    failedHint: 'Unplug the TV for 30 seconds and open the app again. If it keeps happening, reinstall version __APP_VERSION__.',
    stale: 'An earlier version of the app is still running on the TV.',
    staleHint: 'Unplug the TV for 30 seconds and open the app again. Turning it off with the remote is not enough when Quick Start+ is on.',
    retry: 'Try again'
};
var finished = false;
var startedAt = Date.now();
var shown = '';

function $(id) { return document.getElementById(id); }
function setStatus(text) {
    if (text === shown) return;
    shown = text;
    $('status').innerHTML = text;
}
$('retry').innerHTML = TEXT.retry;
setStatus(TEXT.starting);

/* the error screen; code says what happened, for a report or a photo of the screen */
function fail(text, hint, code) {
    if (finished) return;
    finished = true;
    $('box').className = 'box failed';
    setStatus(text);
    $('hint').innerHTML = hint;
    $('hint').style.visibility = 'visible';
    $('code').innerHTML = code;
    $('error').style.display = 'block';
}
/* An earlier version's local server can survive an update; the service stops it before
   starting this one (launch.js). If another version still answers for a while, that did
   not work: say so instead of waiting for the timeout. */
var STALE_AFTER_MS = 35000;
var otherVersion = '';
var otherSince = 0;
function staleFailure(code) {
    fail(TEXT.stale, TEXT.staleHint, code + ' · __APP_VERSION__');
}

function openApp() {
    if (finished) return;
    finished = true;
    setStatus(TEXT.opening);
    location.replace('http://127.0.0.1:__APP_PORT__/beta?v=__APP_VERSION__');
}

function ping() {
    if (finished) return;
    try {
        var request = new XMLHttpRequest();
        request.open('GET', 'http://127.0.0.1:__APP_PORT__/health?t=' + Date.now(), true);
        request.timeout = 1500;
        request.onreadystatechange = function () {
            if (request.readyState === 4 && request.status === 200) {
                try {
                    var health = JSON.parse(request.responseText);
                    if (health.version === '__APP_VERSION__') openApp();
                    else if (health.version) {
                        if (health.version !== otherVersion) { otherVersion = health.version; otherSince = Date.now(); }
                        if (Date.now() - otherSince > STALE_AFTER_MS) staleFailure('STALE_SERVICE ' + otherVersion);
                    }
                } catch (ignore) {}
            }
        };
        request.onerror = function () {};
        request.ontimeout = function () {};
        request.send();
    } catch (ignore) {}

    var elapsed = Date.now() - startedAt;
    if (finished) return;
    if (elapsed > 90000) {
        fail(TEXT.failed, TEXT.failedHint, 'RUNTIME_START_TIMEOUT · __APP_VERSION__');
        return;
    }
    if (elapsed > 20000) setStatus(TEXT.almost);
    else if (elapsed > 3000) setStatus(TEXT.server);
    if (elapsed > 8000 && $('hint').style.visibility !== 'visible') {
        $('hint').innerHTML = TEXT.hint;
        $('hint').style.visibility = 'visible';
    }
    setTimeout(ping, 400);
}

try {
    var bridge = new PalmServiceBridge();
    bridge.onservicecallback = function (response) {
        try {
            var data = JSON.parse(response);
            /* a service of another version means the old service is still the one running */
            if (data.ready && (!data.version || data.version === '__APP_VERSION__')) openApp();
            else if (data.ready) staleFailure('OLD_SERVICE ' + data.version);
            else if (data.reason === 'STALE_SERVICE') staleFailure('STALE_SERVICE ' + data.staleVersion + ' · ' + (data.detail || ''));
        } catch (ignore) {}
    };
    bridge.call('luna://__SERVICE_ID__/start', '{}');
} catch (ignore) {}

ping();
</script>
</body>
</html>
