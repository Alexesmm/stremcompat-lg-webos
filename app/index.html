<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stremio</title>
<style>
html,body{width:100%;height:100%;overflow:hidden}
body{margin:0;background:#090b12;color:#fff;font-family:Arial,sans-serif}
.backdrop{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 43%,rgba(102,62,202,.2),transparent 34%),#090b12}
.stage{position:fixed;left:0;right:0;top:0;bottom:0;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center}
.brand{width:560px}
.mark{width:94px;height:94px;margin:0 auto 22px;background:url(icon.png) center/contain no-repeat;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.72}50%{opacity:1}}
h1{font-size:38px;line-height:1;margin:0;font-weight:700;letter-spacing:.4px}
.boot{margin:62px auto 0;width:420px}
.status{font-size:20px;color:rgba(255,255,255,.76);margin-bottom:18px}
.track{height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.fill{height:100%;width:8%;border-radius:4px;background:#9c76ff;transition:width .45s ease}
.hint{font-size:15px;color:rgba(255,255,255,.34);margin-top:15px}
.error{margin-top:28px;display:none}
button{font-size:21px;font-weight:700;padding:16px 30px;color:#0b0910;background:#fff;border:0;border-radius:12px}
.code{font-size:15px;color:rgba(255,255,255,.4);margin:15px 0}
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="stage"><div class="brand">
  <div class="mark"></div>
  <h1>StremCompat</h1>
  <div class="boot">
    <div id="status" class="status">Starting the playback system…</div>
    <div class="track"><div id="fill" class="fill"></div></div>
    <div id="hint" class="hint">On the first launch, the runtime may take a few seconds.</div>
    <div id="error" class="error">
      <button onclick="location.reload()">Try again</button>
      <div class="code">Code: RUNTIME_START_TIMEOUT</div>
    </div>
  </div>
</div></div>
<script>
var finished = false;
var startedAt = Date.now();
var serviceAnswered = false;

function setProgress(value, text) {
    document.getElementById('fill').style.width = value + '%';
    if (text) document.getElementById('status').innerHTML = text;
}

function openApp() {
    if (finished) return;
    finished = true;
    setProgress(100, 'Ready. Opening…');
    location.replace('http://127.0.0.1:__APP_PORT__/beta?v=__APP_VERSION__');
}

function ping() {
    if (finished) return;
    try {
        var request = new XMLHttpRequest();
        request.open('GET', 'http://127.0.0.1:__APP_PORT__/health?t=' + Date.now(), true);
        request.timeout = 1500;
        request.onreadystatechange = function () {
            if (request.readyState === 4 && request.status === 200) {
                try { var health = JSON.parse(request.responseText);if (health.version === '__APP_VERSION__') openApp(); } catch (ignore) {}
            }
        };
        request.onerror = function () {};
        request.ontimeout = function () {};
        request.send();
    } catch (ignore) {}

    var elapsed = Date.now() - startedAt;
    if (elapsed > 90000) {
        document.getElementById('status').innerHTML = 'The runtime did not respond. Restart the TV and reinstall version __APP_VERSION__.';
        document.getElementById('hint').innerHTML = 'This package includes its own ARMv7 Node 18 runtime; this error does not mean that the wrong ARM edition was installed.';
        document.getElementById('error').style.display = 'block';
        return;
    }
    if (elapsed > 20000) setProgress(72, 'Finishing media services…');
    else if (elapsed > 7000) setProgress(48, 'Loading the optimized player…');
    else if (elapsed > 2000) setProgress(26, 'Preparing your experience…');
    setTimeout(ping, 400);
}

try {
    var bridge = new PalmServiceBridge();
    bridge.onservicecallback = function (response) {
        serviceAnswered = true;
        try {
            var data = JSON.parse(response);
            if (data.ready) openApp();
        } catch (ignore) {}
    };
    bridge.call('luna://__SERVICE_ID__/start', '{}');
} catch (ignore) {}

ping();
</script>
</body>
</html>
