name: Build and release profiles

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run runtime
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run package:all
      - name: Prepare clear release filenames
        shell: pwsh
        run: |
          Move-Item -LiteralPath 'dist/io.strem.tv_1.2.5_all.ipk' -Destination 'dist/StremCompat-webOS4-UM4-armv7-graphics-1920x1080-1.2.5.ipk'
          Move-Item -LiteralPath 'dist/io.strem.tv.hd_1.2.5_all.ipk' -Destination 'dist/StremCompat-webOS4-UM4-armv7-graphics-1280x720-1.2.5.ipk'
          Move-Item -LiteralPath 'dist/io.strem.tv.uj3native_1.0.4_all.ipk' -Destination 'dist/StremCompat-webOS3-UJ3-armv7-graphics-1920x1080-1.0.4.ipk'
          Move-Item -LiteralPath 'dist/io.strem.tv.uj3native.hd_1.0.4_all.ipk' -Destination 'dist/StremCompat-webOS3-UJ3-armv7-graphics-1280x720-1.0.4.ipk'
      - uses: actions/upload-artifact@v4
        with:
          name: webos-ipks
          path: dist/*.ipk
      - name: Publish tag assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: StremCompat for LG webOS ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*.ipk
