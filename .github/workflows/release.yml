name: Build and release profiles

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run runtime
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run package
      - name: Name the 1920x1080 package
        shell: pwsh
        run: |
          $version = (Get-Content app/appinfo.json -Raw | ConvertFrom-Json).version
          Move-Item -LiteralPath "dist/io.github.alexesmm.legacytv_${version}_all.ipk" -Destination "dist/StremCompat-${{ github.ref_name }}-1080p.ipk"
      - run: npm run package:720
      - name: Name the 1280x720 package
        shell: pwsh
        run: |
          $version = (Get-Content app/appinfo.json -Raw | ConvertFrom-Json).version
          Move-Item -LiteralPath "dist/io.github.alexesmm.legacytv_${version}_all.ipk" -Destination "dist/StremCompat-${{ github.ref_name }}-720p.ipk"
      - run: node scripts/make-homebrew-repo.js dist/StremCompat-${{ github.ref_name }}-1080p.ipk homebrew-repo
        if: startsWith(github.ref, 'refs/tags/')
      - run: node scripts/make-homebrew-repo.js dist/StremCompat-${{ github.ref_name }}-720p.ipk homebrew-repo/720 https://alexesmm.github.io/stremcompat-lg-webos/720
        if: startsWith(github.ref, 'refs/tags/')
      - uses: actions/upload-artifact@v4
        with:
          name: webos-ipks
          path: dist/*.ipk
      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          path: homebrew-repo
      - name: Publish tag assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: StremCompat for LG webOS ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*.ipk

  homebrew-repository:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
