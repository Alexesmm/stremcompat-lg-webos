<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stremio</title>
<style>
/* Designed for the 1920x1080 webview. Netflix-like, BIG and clear.
   RULES LEARNED ON THIS TV: no blurred shadows, no scale animations, transform-only
   motion, static focus ring, class-based focus (never :focus). */
html,body{margin:0;padding:0;width:100%;height:100%;background:#0c0b11;color:#fff;font-family:sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
img{border:0}

/* two-layer backdrop: incoming art fades IN over the old one = true crossfade, no pop.
   Art lives in the TOP half; a strong gradient + corner vignette melts it to black below. */
#bg,#bg2{position:fixed;top:0;left:0;right:0;height:74%;background-size:cover;background-position:center top;opacity:0;transition:opacity .5s ease}
#bg.on,#bg2.on{opacity:.72}
#bgshade{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(12,11,17,0) 26%,rgba(12,11,17,.72) 58%,#0c0b11 78%),linear-gradient(to right,rgba(12,11,17,.9) 0%,rgba(12,11,17,.45) 46%,rgba(12,11,17,.12) 100%),radial-gradient(130% 92% at 55% 16%,rgba(0,0,0,0) 40%,rgba(0,0,0,.5) 100%);transition:opacity .9s ease}
/* DETAIL pages: backdrop fills the whole screen (not the top-74% crop), just a soft bottom
   vignette + a left darken so the title/info stay readable. */
body.detail #bg,body.detail #bg2{height:100%}
body.detail #bg.on,body.detail #bg2.on{opacity:.9}
body.detail #bgshade{background:linear-gradient(to bottom,rgba(12,11,17,.15) 0%,rgba(12,11,17,0) 22%,rgba(12,11,17,0) 52%,rgba(12,11,17,.55) 84%,#0c0b11 100%),linear-gradient(to right,rgba(12,11,17,.8) 0%,rgba(12,11,17,.28) 52%,rgba(12,11,17,0) 100%)}

/* idle: after a pause the UI just dims a little; nothing melts away. If a trailer is
   available it plays IN THE BACKDROP SLOT (replacing the poster art) with the exact same
   vignette + smooth edges, so it reads as the cover art coming to life. */
#topnav,#hero,#rowsClip,#dWrap,#heroTitle,#heroLogo,#heroMeta,#heroDesc{transition:opacity .9s ease}
body.idle #topnav,body.idle #hero,body.idle #rowsClip,body.idle #dWrap{opacity:.82}
body.trailer #bg.on,body.trailer #bg2.on{opacity:0}
/* trailer playing: everything on the upper half melts to near-nothing; only the title
   cover-art/logo stays (~.78). Smooth .9s fades. */
body.trailer #hero{opacity:1}
body.trailer #topnav{opacity:.16}
body.trailer #heroMeta,body.trailer #heroDesc{opacity:.1}
body.trailer #heroTitle,body.trailer #heroLogo{opacity:.78}
/* first row overlaps the trailer -> very low; the rows below it stay readable at .75 */
body.trailer #rowsClip{opacity:1}
body.trailer #rows .row{opacity:.75}
body.trailer #rows .row:first-child{opacity:.14}
body.trailer #dWrap{opacity:.14}

/* ---------- top nav (centered; clock pinned right) ---------- */
#topnav{position:fixed;top:0;left:0;right:0;height:100px;z-index:20;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
/* Login is intentionally standalone: navigation and the decorative watermark only
   become relevant after an account is connected. */
body.login #topnav,body.login #logobg{display:none}
.chip{padding:14px 40px;margin:0 9px;border-radius:32px;font-size:32px;color:rgba(255,255,255,.78);background:transparent;transition:background .15s ease,color .15s ease}
.chip.cur{color:#fff;font-weight:700}
.chip.f{background:#fff;color:#0c0b11;font-weight:700}
#clock{position:absolute;right:48px;top:50%;-webkit-transform:translateY(-50%);transform:translateY(-50%);font-size:28px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}

/* ---------- screens ---------- */
.scr{position:fixed;top:0;left:0;right:0;bottom:0;display:none}
.scr.on{display:block}

/* ---------- home hero ---------- */
#hero{position:absolute;top:118px;left:48px;width:52%;z-index:5}
#heroLogo{max-width:520px;max-height:175px;display:none}
#heroTitle{font-size:78px;font-weight:800;line-height:1.05;max-height:164px;overflow:hidden}
#heroMeta{margin-top:18px;font-size:30px;color:#c9b8ff;font-weight:600}
#heroDesc{margin-top:16px;font-size:28px;line-height:1.48;color:rgba(255,255,255,.92);max-height:126px;overflow:hidden}

/* ---------- rows ---------- */
#rowsClip{position:absolute;top:522px;left:0;right:0;bottom:0;overflow:hidden}
#rows{position:absolute;top:0;left:0;right:0}
.row{padding:18px 0 34px 48px;opacity:0;transform:translateY(16px);transition:opacity .35s ease,transform .35s ease}
.row.in{opacity:1;transform:none}
.rowtitle{font-size:36px;font-weight:700;margin:0 0 18px 4px;color:rgba(255,255,255,.95)}
.cards{white-space:nowrap}
.cards.snap{transition:none} /* while holding a direction: steps snap, no animation lag */
.card{display:inline-block;vertical-align:top;position:relative;width:264px;height:396px;margin-right:24px;border-radius:14px;background:#1b1927;overflow:hidden;transition:transform .13s ease}
.card img{width:100%;height:100%;border-radius:14px}
.card .nm{position:absolute;top:0;left:0;right:0;bottom:0;padding:16px;font-size:28px;line-height:1.3;white-space:normal;color:rgba(255,255,255,.9)}
.titlelabel{position:absolute;left:0;right:0;bottom:0;padding:34px 15px 13px;font-size:25px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.92));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.f{box-shadow:0 0 0 5px #fff !important;z-index:6;transform:translateY(-8px)}
.card.wide{width:430px;height:242px}
.pbar{position:absolute;left:0;right:0;bottom:0;height:9px;background:rgba(255,255,255,.25)}
.pbar div{height:100%;background:#8c5cff}
.cwlabel{position:absolute;left:0;right:0;bottom:9px;padding:12px 15px;font-size:26px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.88));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbadge{position:absolute;top:12px;right:12px;width:46px;height:46px;border-radius:50%;background:rgba(140,92,255,.96);color:#fff;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.55);z-index:3}
.wbadge svg{width:28px;height:28px;fill:currentColor}
.ep .th .wbadge{top:8px;right:8px;width:40px;height:40px}
.ep .th .wbadge svg{width:24px;height:24px}

/* ---------- detail ---------- */
#dWrap{position:absolute;top:100px;left:48px;right:48px;bottom:0}
#dPoster{position:absolute;top:24px;right:0;width:330px;height:495px;border-radius:16px;display:none}
#dLogo{max-width:560px;max-height:190px;display:none}
#dTitle{font-size:80px;font-weight:800;max-width:70%;line-height:1.05}
#dMeta{margin-top:20px;font-size:31px;color:#c9b8ff;font-weight:600}
.drating{color:#ffd27a;font-weight:800}
#dInfo{margin-top:20px;font-size:27px;color:rgba(255,255,255,.9);max-width:70%}
#dInfo div{margin-bottom:9px}
.dlbl{display:inline-block;width:190px;color:rgba(255,255,255,.52);font-size:23px;text-transform:uppercase;letter-spacing:1.4px}
#dDesc{margin-top:16px;font-size:29px;line-height:1.5;color:rgba(255,255,255,.92);max-width:68%;max-height:136px;overflow:hidden}
#dBtns{margin-top:34px}
.btn{display:inline-block;padding:19px 50px;margin-right:20px;border-radius:14px;font-size:31px;font-weight:700;background:rgba(255,255,255,.14);color:#fff;transition:background .12s ease}
.btn.f{background:#fff;color:#0c0b11}
#dSeasons{margin-top:32px;display:none}
.schip{display:inline-block;padding:13px 32px;margin-right:14px;border-radius:28px;font-size:27px;background:rgba(255,255,255,.10);color:rgba(255,255,255,.85)}
.schip.cur{background:rgba(140,92,255,.35);color:#fff}
.schip.f{background:#fff;color:#0c0b11;font-weight:700}
#dEps{margin-top:22px;height:560px;overflow:hidden;display:none}
#dEpsInner{transition:transform .16s ease}
.ep{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:16px 20px;border-radius:14px;margin-bottom:10px;max-width:1020px;transition:background .12s ease}
.ep .th{width:280px;height:158px;border-radius:10px;background:#0a0a10;margin-right:26px;-webkit-flex:none;flex:none;overflow:hidden;position:relative}
.ep .th img{width:100%;height:100%;border-radius:10px;object-fit:contain} /* whole still, no crop/distort */
.ep .th:after{content:"";position:absolute;left:0;right:0;bottom:0;height:48%;background:linear-gradient(transparent,rgba(0,0,0,.6));border-radius:0 0 10px 10px;pointer-events:none}
.ep .bd{-webkit-flex:1;flex:1;min-width:0}
.ep .t{font-size:30px;font-weight:600}
.ep .o{margin-top:8px;font-size:25px;color:rgba(255,255,255,.7);max-height:70px;overflow:hidden;line-height:1.38}
.ep.f{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 3px #fff}
.ep.w .t{color:#a98fff}

/* ---------- streams overlay ---------- */
#streams{position:fixed;top:100px;right:0;bottom:0;width:800px;background:rgba(16,14,24,.98);z-index:40;display:none;padding:30px 30px;box-sizing:border-box}
#streams h3{margin:0 0 8px;font-size:38px}
#stSub{font-size:26px;color:rgba(255,255,255,.65);margin-bottom:16px}
#stChips{white-space:nowrap;overflow:hidden;margin-bottom:8px}
.stchip{display:inline-block;padding:12px 28px;margin-right:12px;border-radius:28px;font-size:25px;font-weight:600;background:rgba(255,255,255,.10);color:rgba(255,255,255,.8)}
.stchip.cur{background:rgba(140,92,255,.4);color:#fff}
.stchip.f{background:#fff;color:#0c0b11}
#stClip{position:absolute;top:224px;left:30px;right:30px;bottom:30px;overflow:hidden}
#stInner{transition:transform .16s ease}
.sthead{padding:20px 6px 10px;font-size:23px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1.5px}
.st{padding:24px 26px;border-radius:12px;margin-bottom:12px;transition:background .12s ease}
.st .a{font-size:29px;font-weight:700;color:#c9b8ff}
.st .b{margin-top:9px;font-size:26px;line-height:1.4;color:rgba(255,255,255,.92);max-height:112px;overflow:hidden;white-space:normal;word-break:break-word}
.st.f{background:#8c5cff}
.stmsg{padding:22px;font-size:27px;color:rgba(255,255,255,.65)}

/* ---------- continue-watching long-press menu ---------- */
#cwm{position:fixed;top:0;right:0;bottom:0;width:600px;background:rgba(16,14,24,.98);z-index:45;display:none;padding:56px 44px;box-sizing:border-box}
#cwmTitle{font-size:40px;font-weight:800;margin-bottom:8px;max-height:110px;overflow:hidden}
#cwmSub{font-size:24px;color:rgba(255,255,255,.55);margin-bottom:34px}
.cwmi{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:23px 30px;border-radius:12px;font-size:30px;font-weight:600;margin-bottom:10px;background:rgba(255,255,255,.05);transition:background .12s ease}
.cwmi svg{width:34px;height:34px;margin-right:22px;-webkit-flex:none;flex:none;fill:currentColor;opacity:.92}
.cwmi.f{background:#8c5cff}

/* ---------- similar ---------- */
#simWrap{position:absolute;top:120px;left:48px;right:0;bottom:0}
#simTitle{font-size:44px;font-weight:800;margin-bottom:26px}
#simClip{position:absolute;top:104px;left:-14px;right:0;bottom:0;overflow:hidden;padding-left:14px}
#simGrid{padding:16px 0 0 14px;transition:transform .2s ease}
#simGrid .card{margin-bottom:26px}

/* ---------- idle trailer layer (top area only; #bgshade vignettes it into black) ---------- */
#bgv{position:fixed;top:0;left:0;width:100%;height:74%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
#bgv.on{opacity:1}

/* ---------- discover ---------- */
#discWrap{position:absolute;top:120px;left:48px;right:0;bottom:0}
.frow{white-space:nowrap;overflow:hidden;margin-bottom:16px}
.fchip{display:inline-block;padding:12px 30px;margin-right:12px;border-radius:26px;font-size:26px;font-weight:600;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8)}
.fchip.cur{background:rgba(140,92,255,.4);color:#fff}
.fchip.f{background:#fff;color:#0c0b11}
#discGridClip{position:absolute;top:170px;left:0;right:0;bottom:0;overflow:hidden}
#discGrid{transition:transform .2s ease}
#discGrid .card{margin-bottom:26px}

/* ---------- search ---------- */
#sWrap{position:absolute;top:126px;left:48px;right:48px;bottom:0}
#sBox{width:940px;padding:22px 32px;font-size:34px;border:0;border-radius:14px;background:rgba(255,255,255,.10);color:#fff;outline:none}
#sBox.f{background:rgba(255,255,255,.22);box-shadow:0 0 0 3px #fff}
#sHint{margin-top:16px;font-size:25px;color:rgba(255,255,255,.58)}
#sRowsClip{position:absolute;top:156px;left:0;right:0;bottom:0;overflow:hidden}
#sRows{position:absolute;top:0;left:-48px;right:0;padding-top:26px}

/* ---------- library ---------- */
#lWrap{position:absolute;top:126px;left:48px;right:0;bottom:0;overflow:hidden}
#lGrid{transition:transform .2s ease}
#lGrid .card{margin-bottom:26px}

/* ---------- settings / account ---------- */
#setWrap{position:absolute;top:130px;left:48px;right:48px;bottom:40px;overflow:hidden}
#setInner{transition:transform .2s ease}
#setAcct{padding:20px 26px;border-radius:16px;background:rgba(255,255,255,.06);margin-bottom:26px;max-width:1100px}
#setAcct .em{font-size:32px;font-weight:700}
#setAcct .pl{margin-top:8px;font-size:24px;color:rgba(255,255,255,.6)}
.set{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;max-width:1100px;padding:19px 26px;border-radius:14px;margin-bottom:8px;transition:background .12s ease}
.set .lb{font-size:29px;font-weight:600;-webkit-flex:1;flex:1}
.set .vl{font-size:28px;color:#c9b8ff;font-weight:700}
.set.f{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 3px #fff}
.set.act .vl{color:#ff9a9a}
.sethint{margin:18px 0 0 26px;font-size:22px;color:rgba(255,255,255,.45)}
.setgrp{font-size:23px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#a98fff;margin:30px 0 12px 26px}
#setItems > .setgrp:first-child{margin-top:6px}

/* ---------- login ---------- */
#lgWrap{position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
#lgLang{position:fixed;top:34px;right:42px;padding:12px 22px;border-radius:24px;font-size:22px;color:rgba(255,255,255,.78);background:rgba(255,255,255,.08);z-index:3}
#lgLang.f{background:#fff;color:#0c0b11;font-weight:700}
#lgBox{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
#lgQr{text-align:center;padding-right:90px;border-right:1px solid rgba(255,255,255,.14)}
#lgQr h2{font-size:40px;margin:0 0 10px}
#lgQr .s{font-size:24px;color:rgba(255,255,255,.6);margin-bottom:26px}
#lgQrImg{width:300px;height:300px;background:#fff;border-radius:18px;padding:12px;box-sizing:border-box}
#lgCode{font-size:46px;letter-spacing:9px;font-weight:800;margin-top:20px}
#lgStat{margin-top:14px;font-size:22px;color:rgba(255,255,255,.6)}
#lgForm{padding-left:90px}
#lgForm h2{font-size:40px;margin:0 0 22px}
.lgin{display:block;width:520px;padding:18px 24px;margin-bottom:16px;font-size:28px;border:0;border-radius:12px;background:rgba(255,255,255,.10);color:#fff;outline:none}
.lgin.f{background:rgba(255,255,255,.22);box-shadow:0 0 0 3px #fff}
#lgBtn{display:inline-block;padding:16px 54px;border-radius:12px;font-size:29px;font-weight:700;background:rgba(255,255,255,.14)}
#lgBtn.f{background:#fff;color:#0c0b11}
#lgErr{margin-top:16px;font-size:23px;color:#ff9a9a;min-height:28px}

/* ---------- misc ---------- */
#toast{position:fixed;left:50%;top:7%;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:rgba(20,18,30,.9);font-size:28px;font-weight:600;padding:14px 32px;border-radius:30px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none}
#boot{position:fixed;top:0;left:0;right:0;bottom:0;background:#0c0b11;z-index:100;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
#boot .lg{width:132px;height:132px;animation:bb 2s ease-in-out infinite}
@keyframes bb{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
/* faded official Stremio logo shown where cover art would be (Settings + empty Search) */
#logobg{position:fixed;top:0;left:0;right:0;height:74%;background:url(/logo.png) center 32%/196px no-repeat;opacity:0;transition:opacity .5s ease;z-index:0}
#logobg.on{opacity:.09}
/* subtle entrance for Search / Settings (boards have their own row stagger) */
@keyframes fadeup{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.anim-in{animation:fadeup .42s ease}
</style>
</head>
<body>
<div id="bg"></div><div id="bg2"></div><div id="logobg"></div><div id="bgshade"></div>

<div id="topnav">
  <div class="chip" id="chipSearch">Search</div>
  <div class="chip" id="chipHome">Home</div>
  <div class="chip" id="chipDisc">Discover</div>
  <div class="chip" id="chipLib">Library</div>
  <div class="chip" id="chipSet">Settings</div>
  <div id="clock"></div>
</div>

<!-- shared board layer: Home / Discover / Library all render their hero+rows here -->
<div class="scr" id="scrBoard">
  <div id="hero"><img id="heroLogo"><div id="heroTitle"></div><div id="heroMeta"></div><div id="heroDesc"></div></div>
  <div id="rowsClip"><div id="rows"></div></div>
</div>

<div class="scr" id="scrDetail">
  <div id="dWrap">
    <img id="dPoster">
    <img id="dLogo"><div id="dTitle"></div><div id="dMeta"></div><div id="dInfo"></div><div id="dDesc"></div>
    <div id="dBtns"></div>
    <div id="dSeasons"></div>
    <div id="dEps"><div id="dEpsInner"></div></div>
  </div>
</div>

<div class="scr" id="scrSearch">
  <div id="sWrap">
    <input id="sBox" placeholder="Search movies and series">
    <div id="sHint">Press OK to type, then press Down to browse results</div>
    <div id="sRowsClip"><div id="sRows"></div></div>
  </div>
</div>

<div class="scr" id="scrSet">
  <div id="setWrap"><div id="setInner">
    <div id="setAcct"><div class="em"></div><div class="pl"></div></div>
    <div id="setItems"></div>
    <div class="sethint" id="setHint">Use Left/Right to change · changes apply immediately</div>
  </div></div>
</div>

<div class="scr" id="scrLogin">
  <div id="lgLang">Language: English&nbsp;&nbsp;‹ ›</div>
  <div id="lgWrap"><div id="lgBox">
    <div id="lgQr"><h2 id="lgQrTitle">Sign in with your phone</h2><div class="s" id="lgQrHelp">Scan the code with your camera</div><img id="lgQrImg"><div id="lgCode"></div><div id="lgStat">Generating code…</div></div>
    <div id="lgForm"><h2 id="lgEmailTitle">Or use your email</h2>
      <input class="lgin" id="lgEmail" placeholder="Email">
      <input class="lgin" id="lgPass" placeholder="Password" type="password">
      <div id="lgBtn">Sign in</div>
      <div id="lgErr"></div>
    </div>
  </div></div>
</div>

<div class="scr" id="scrSim">
  <div id="simWrap"><div id="simTitle"></div><div id="simClip"><div id="simGrid"></div></div></div>
</div>

<div id="streams"><h3 id="streamsTitle">Sources</h3><div id="stSub"></div><div id="stChips"></div><div id="stClip"><div id="stInner"></div></div></div>
<div id="cwm"><div id="cwmTitle"></div><div id="cwmSub"></div><div id="cwmItems"></div></div>
<div id="toast"></div>
<div id="boot"><img class="lg" src="/logo.png"></div>

<script>
/* Kept separate from the application script: syntax/runtime failures in the main
   bundle must still produce a readable error on old TV engines. */
(function(){
  window.__STREMIO_BOOT_DONE__=false;
  window.__STREMIO_BOOT_FAILED__=false;
  window.__STREMIO_BOOT_PHASE__='G0';
  var phase=document.createElement('div');
  phase.id='bootPhase';
  phase.style.cssText='position:absolute;left:0;right:0;bottom:42px;text-align:center;color:#837d91;font:16px Arial,sans-serif;letter-spacing:1px';
  phase.innerHTML='Starting G0';
  document.getElementById('boot').appendChild(phase);
  window.__STREMIO_PHASE__=function(code){
    if(window.__STREMIO_BOOT_FAILED__)return;
    window.__STREMIO_BOOT_PHASE__=String(code||'UNKNOWN');
    var p=document.getElementById('bootPhase');if(p)p.innerHTML='Starting '+window.__STREMIO_BOOT_PHASE__;
  };
  window.__STREMIO_SCRIPT_LOADED__=function(){
    if(window.__STREMIO_BOOT_PHASE__==='G0')window.__STREMIO_PHASE__('SCRIPT_LOADED_NO_ENTRY');
  };
  window.__STREMIO_BOOT_ERROR__=function(message,line){
    window.__STREMIO_BOOT_FAILED__=true;
    window.__STREMIO_BOOT_MESSAGE__=String(message||'Unknown startup error');
    window.__STREMIO_BOOT_LINE__=String(line||'');
    var b=document.getElementById('boot');if(!b)return;
    b.style.background='#08070d';b.style.color='#fff';b.style.fontFamily='Arial,sans-serif';
    b.style.textAlign='center';b.style.paddingTop='28vh';b.style.boxSizing='border-box';
    b.innerHTML='<div style="font-size:42px;font-weight:bold;margin-bottom:20px">Stremio could not finish loading</div>'+
